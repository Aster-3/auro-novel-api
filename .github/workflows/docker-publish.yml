name: Production CI/CD Pipeline
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auronovel-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/auronovel-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Get GitHub Runner Public IP
        id: get-ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=${RUNNER_IP}" >> $GITHUB_ENV

      - name: AWS Security Group İznini Aç
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-033428ebcd70a2d04 \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/auro-novel-api
            docker compose pull api
            docker compose run --rm api npm run migration:run:prod
            docker compose up -d --no-deps --build api
            docker image prune -f

      - name: AWS Security Group İznini Kaldır
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-033428ebcd70a2d04 \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32
