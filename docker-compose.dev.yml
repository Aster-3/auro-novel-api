services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: auro-novel-api
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npm run dev
  db:
    image: postgres:18.3-alpine
    container_name: auro-novel-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: auro_novel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
volumes:
  db_data:
